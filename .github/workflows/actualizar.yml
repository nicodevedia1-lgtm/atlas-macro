# GitHub Action: corre actualizar.py solo, todos los lunes, y guarda el datos.json nuevo.
name: Actualizar datos

on:
  schedule:
    - cron: "17 9 * * 1"      # todos los lunes a las 9:17 UTC (6:17 en Argentina)
  workflow_dispatch:          # agrega un botón "Run workflow" para correrlo a mano

permissions:
  contents: write             # le da permiso para guardar cambios en el repositorio

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Bajar el repositorio
        uses: actions/checkout@v6

      - name: Instalar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Instalar las librerías
        run: pip install -r requirements.txt

      - name: Correr el script
        run: python actualizar.py

      - name: Guardar datos.json si cambió
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add datos.json
          if git diff --cached --quiet; then
            echo "Los datos no cambiaron."
          else
            git commit -m "Datos actualizados"
            git pull --rebase
            git push
          fi
