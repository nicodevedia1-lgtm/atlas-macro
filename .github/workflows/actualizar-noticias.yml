name: Actualizar noticias

on:
  schedule:
    - cron: "37 10 * * *"   # todos los días, 10:37 UTC (7:37 en Argentina)
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  noticias:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python actualizar_noticias.py

      - name: Guardar noticias.json si cambió
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add noticias.json
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "Noticias actualizadas"
            git pull --rebase
            git push
          fi

      - name: Avisar si cambió algún gobierno
        if: hashFiles('alertas.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create alerta-gobierno --color D93F0B --force
          numero=$(gh issue list --label alerta-gobierno --state open --json number --jq '.[0].number')
          if [ -n "$numero" ]; then
            gh issue comment "$numero" --body-file alertas.md
          else
            gh issue create --title "Revisar gobiernos en las fichas" --label alerta-gobierno --body-file alertas.md
          fi
