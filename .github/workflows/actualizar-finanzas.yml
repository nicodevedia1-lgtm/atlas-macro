name: Actualizar Argentina financiera

on:
  schedule:
    - cron: "41 22 * * 1-5"   # lunes a viernes 22:41 UTC (19:41 en Argentina, después del cierre)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finanzas:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python actualizar_finanzas.py

      - name: Guardar finanzas.json si cambió
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add finanzas.json
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "Argentina financiera actualizada"
            git pull --rebase
            git push
          fi
