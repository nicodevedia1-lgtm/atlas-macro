name: Actualizar series de Argentina

on:
  schedule:
    - cron: "19 23 * * 1-5"   # lunes a viernes 23:19 UTC (20:19 en Argentina)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  series:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python actualizar_series_ar.py

      - name: Guardar series_ar.json si cambió
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add series_ar.json
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "Series de Argentina actualizadas"
            git pull --rebase
            git push
          fi
