name: Actualizar tasas del mundo y curva del Tesoro

on:
  schedule:
    - cron: "53 12 * * 2"   # los martes 12:53 UTC (las tasas del BIS son mensuales; la curva, del cierre anterior)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  global:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python actualizar_global.py

      - name: Guardar global.json si cambió
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add global.json
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "Tasas del mundo y curva del Tesoro actualizadas"
            git pull --rebase
            git push
          fi
