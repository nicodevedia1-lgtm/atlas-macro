name: Actualizar comercio por producto

on:
  schedule:
    - cron: "23 14 5 * *"   # el día 5 de cada mes, 14:23 UTC (Comtrade suma países de a poco)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  productos:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python actualizar_productos.py
        env:
          COMTRADE_KEY: ${{ secrets.COMTRADE_KEY }}

      - name: Guardar productos.json si cambió
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add productos.json
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "Comercio por producto actualizado"
            git pull --rebase
            git push
          fi
