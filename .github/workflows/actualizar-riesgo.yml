name: Actualizar riesgo país de Latinoamérica

on:
  schedule:
    - cron: "47 11 * * 2"   # todos los martes, 11:47 UTC (el BCRP publica una vez por mes)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  riesgo:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python actualizar_riesgo.py

      - name: Guardar riesgo.json si cambió
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add riesgo.json
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "Riesgo país actualizado"
            git pull --rebase
            git push
          fi
