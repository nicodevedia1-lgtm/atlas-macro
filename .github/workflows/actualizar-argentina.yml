# GitHub Action: actualiza el riesgo país y el dólar de Argentina todos los días hábiles.
name: Actualizar Argentina

on:
  schedule:
    - cron: "17 22 * * 1-5"   # lunes a viernes a las 22:17 UTC (19:17 en Argentina, después del cierre)
  workflow_dispatch:          # botón para correrlo a mano

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Bajar el repositorio
        uses: actions/checkout@v6

      - name: Instalar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Instalar las librerías
        run: pip install -r requirements.txt

      - name: Correr el script
        run: python actualizar_argentina.py

      - name: Guardar argentina.json si cambió
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add argentina.json
          if git diff --cached --quiet; then
            echo "Los datos no cambiaron."
          else
            git commit -m "Argentina: riesgo país y dólar actualizados"
            git pull --rebase
            git push
          fi
