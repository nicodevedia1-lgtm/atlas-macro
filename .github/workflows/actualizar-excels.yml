name: Actualizar planillas del BCRA

on:
  schedule:
    - cron: "41 22 * * 2,5"   # martes y viernes 22:41 UTC (19:41 en Argentina)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  excels:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python actualizar_excels_bcra.py

      - name: Guardar series_excel.json si cambió
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add series_excel.json
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "Planillas del BCRA actualizadas"
            git pull --rebase
            git push
          fi
