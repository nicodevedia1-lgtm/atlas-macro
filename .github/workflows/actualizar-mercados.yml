name: Actualizar mercados

on:
  schedule:
    - cron: "47 21 * * 1-5"   # lunes a viernes, 21:47 UTC (después del cierre de Wall Street)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mercados:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python actualizar_mercados.py

      - name: Guardar mercados.json si cambió
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mercados.json
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "Mercados actualizados"
            git pull --rebase
            git push
          fi
