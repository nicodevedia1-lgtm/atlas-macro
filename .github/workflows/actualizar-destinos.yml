name: Actualizar qué vende cada país y a quién

on:
  schedule:
    - cron: "37 13 12 * *"   # el día 12 de cada mes, 13:37 UTC (lejos del día 5, para no gastar el cupo diario de Comtrade el mismo día)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  destinos:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python actualizar_destinos.py
        env:
          COMTRADE_KEY: ${{ secrets.COMTRADE_KEY }}

      - name: Guardar destinos.json si cambió
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add destinos.json
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "Qué vende cada país actualizado"
            git pull --rebase
            git push
          fi
