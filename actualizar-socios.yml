name: Actualizar socios comerciales

on:
  schedule:
    - cron: "43 11 3 * *"   # el día 3 de cada mes, 11:43 UTC (WITS suma países de a poco)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  socios:
    runs-on: ubuntu-latest
    timeout-minutes: 120     # WITS es lento: puede tardar más de una hora
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python actualizar_socios.py

      - name: Guardar socios.json si cambió
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add socios.json
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "Socios comerciales actualizados"
            git pull --rebase
            git push
          fi
